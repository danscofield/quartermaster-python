[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quartermaster"
version = "0.1.0"
description = "Python client for Quartermaster credential vending and qm-secrets (Gringotts)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "dscof" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
spire = ["pyspiffe>=0.8"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/dscof/quartermaster-py"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.sdist]
only-include = ["src/quartermaster", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
